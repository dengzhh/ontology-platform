name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 服务端类型检查
        run: npm run typecheck:server
      - name: 前端类型检查与构建
        run: npm run build
      - name: 服务端编译（生产运行产物）
        run: npm run build:server
      - name: 校验生产启动产物（纯 node，无 tsx 运行时）
        env:
          # 生产模式强制要求这两个密钥（安全设计），CI 用一次性测试值
          ONTOOS_SECRET: ci-test-secretbox-not-for-production-use-only
          ONTOOS_JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
        run: |
          PORT=5055 NODE_ENV=production node dist-server/server/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5055/api/health > /dev/null; then echo "生产产物启动成功"; exit 0; fi
            sleep 1
          done
          echo "生产产物启动失败"; exit 1

  smoke:
    name: 冒烟测试（204 项黑盒断言）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 服务端编译
        run: npm run build:server
      - name: 初始化数据库（seed 需要先建表）
        run: npm run db:migrate && npm run seed
      - name: 启动服务
        env:
          NODE_ENV: production
          ONTOOS_SECRET: ci-test-secretbox-not-for-production
          ONTOOS_JWT_SECRET: ci-test-jwt-secret-not-for-production-use
        run: |
          node dist-server/server/index.js &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null; then echo "服务已就绪"; break; fi
            sleep 1
          done
      - name: 装载演示数据（走 HTTP API，需服务先启动）
        run: node demo-data/load.mjs
      - name: 运行冒烟
        env:
          BASE: http://127.0.0.1:5000
        run: node tests/smoke.mjs
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: tests/last-run.json
          if-no-files-found: ignore
