services:
  ontoos:
    # 本地构建；若想直接用官方镜像，注释掉 build 并把 image 改为：
    #   ghcr.io/dengzhh/ontology-platform:latest
    build: .
    image: ontoos-platform:latest
    container_name: ontoos
    restart: unless-stopped
    ports:
      - "${ONTOOS_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # 必填：密钥加密主密钥（≥32 位随机串，生成：openssl rand -base64 32）
      ONTOOS_SECRET: ${ONTOOS_SECRET:?必须设置 ONTOOS_SECRET}
      # 必填：登录令牌签名密钥（缺失或使用仓库默认值时生产拒绝启动）
      ONTOOS_JWT_SECRET: ${ONTOOS_JWT_SECRET:?必须设置 ONTOOS_JWT_SECRET}
      # 置于反向代理（Nginx/Traefik）之后时设为 1，限流按真实客户端 IP
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 空库首次启动自动写入演示数据（chen.xingye / ontos@2026）；
      # 正式部署接真实数据时在 .env 中设 AUTO_SEED=false 关闭
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - ontoos-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ontoos-data:
